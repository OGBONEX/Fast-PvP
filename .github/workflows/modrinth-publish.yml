name: Publish to Modrinth

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"
      - name: Build release JAR
        run: gradle clean build --no-daemon
      - name: Publish version to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "$MODRINTH_TOKEN" ] || [ -z "$MODRINTH_PROJECT_ID" ]; then
            echo "::error::Add MODRINTH_TOKEN and MODRINTH_PROJECT_ID in repository Actions secrets."
            exit 1
          fi

          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources.jar' | head -n 1)"
          if [ -z "$JAR" ]; then
            echo "::error::No release JAR was produced."
            exit 1
          fi

          python3 - <<'PY'
          import json, os
          data = {
              "name": "Pollithium " + os.environ["RELEASE_VERSION"],
              "version_number": os.environ["RELEASE_VERSION"].lstrip("v"),
              "changelog": "See the GitHub release notes for this version.",
              "dependencies": [],
              "game_versions": ["1.21.11"],
              "version_type": "release",
              "loaders": ["fabric"],
              "featured": False,
              "status": "listed",
              "project_id": os.environ["MODRINTH_PROJECT_ID"],
              "file_parts": ["file"],
              "primary_file": "file",
              "environment": "client_only"
          }
          with open("modrinth-version.json", "w", encoding="utf-8") as f:
              json.dump(data, f)
          PY

          curl --fail-with-body --silent --show-error \
            -X POST "https://api.modrinth.com/v2/version" \
            -H "Authorization: $MODRINTH_TOKEN" \
            -F "data=@modrinth-version.json;type=application/json" \
            -F "file=@$JAR"
